name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres # ephemeral CI container only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PUIMS_DEPLOYMENT_PROFILE: development
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Generate throwaway secrets for this run (synthetic data only)
        run: |
          OWNER=$(openssl rand -hex 16); APP=$(openssl rand -hex 16)
          {
            echo "PUIMS_DB_OWNER_PASSWORD=$OWNER"
            echo "PUIMS_DB_APP_PASSWORD=$APP"
            echo "TEST_DATABASE_URL=postgres://puims_app:$APP@localhost:5432/puims_test"
            echo "TEST_MIGRATION_DATABASE_URL=postgres://puims_owner:$OWNER@localhost:5432/puims_test"
            echo "PUIMS_DATA_KEY=$(openssl rand -base64 32)"
            echo "PUIMS_SEED_PASSWORD=ci-$(openssl rand -hex 12)"
          } >> "$GITHUB_ENV"

      - name: Bootstrap roles and test database
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -v owner_password="$PUIMS_DB_OWNER_PASSWORD" -v app_password="$PUIMS_DB_APP_PASSWORD" -v db_name=puims_test -f db/bootstrap.sql

      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Database tests (RLS, audit immutability, constraints, auth service)
        run: npm run test:db
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
